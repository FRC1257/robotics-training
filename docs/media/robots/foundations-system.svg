<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Robot signal and power paths</title><desc id="desc">Power flows from battery through protection and distribution to controllers and motors. Driver input and sensors inform the robot controller, which sends commands to motor controllers. Motors move mechanisms and sensors provide feedback.</desc><rect width="960" height="350" rx="18" fill="#f4f8fc"/><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#1e6b7c"/></marker><marker id="b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#b45520"/></marker></defs><style>.box{fill:white;stroke:#264d63;stroke-width:2}.signal{fill:none;stroke:#1e6b7c;stroke-width:3;marker-end:url(#a)}.power{fill:none;stroke:#b45520;stroke-width:3;marker-end:url(#b)}text{font:16px Arial;fill:#153348}.head{font-weight:bold;font-size:18px}</style>
<rect class="box" x="20" y="28" width="140" height="75" rx="9"/><text x="36" y="58" class="head">Battery</text><text x="36" y="82">electrical energy</text><rect class="box" x="210" y="28" width="160" height="75" rx="9"/><text x="226" y="58" class="head">Protection +</text><text x="226" y="82">distribution</text><rect class="box" x="420" y="28" width="170" height="75" rx="9"/><text x="436" y="58" class="head">Motor controller</text><text x="436" y="82">controls power</text><rect class="box" x="645" y="28" width="130" height="75" rx="9"/><text x="662" y="58" class="head">Motor</text><text x="662" y="82">torque / speed</text><rect class="box" x="800" y="28" width="140" height="75" rx="9"/><text x="816" y="58" class="head">Mechanism</text><text x="816" y="82">moves / acts</text>
<rect class="box" x="20" y="210" width="150" height="75" rx="9"/><text x="36" y="240" class="head">Driver station</text><text x="36" y="264">operator intent</text><rect class="box" x="270" y="210" width="160" height="75" rx="9"/><text x="286" y="240" class="head">Robot controller</text><text x="286" y="264">team code</text><rect class="box" x="660" y="210" width="170" height="75" rx="9"/><text x="676" y="240" class="head">Sensors</text><text x="676" y="264">measured state</text>
<path class="power" d="M160 65H205"/><path class="power" d="M370 65H415"/><path class="power" d="M590 65H640"/><path class="power" d="M775 65H795"/><path class="power" d="M290 103V205"/><path class="signal" d="M170 248H265"/><path class="signal" d="M430 240H650"/><path class="signal" d="M660 260H435"/><path class="signal" d="M490 210V109"/><path class="signal" d="M870 103V170H745V205"/>
<text x="18" y="326">Orange = power / energy path</text><text x="300" y="326">Teal = commands or feedback (conceptual, not a wiring plan)</text></svg>

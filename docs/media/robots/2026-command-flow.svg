<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">2026 scoring command flow</title><desc id="desc">The driver's right bumper starts targeting and a readiness wait. After readiness or timeout, it starts several mechanisms together. The simulation branch has no-op active floor and kicker IO.</desc>
<rect width="1000" height="360" rx="18" fill="#f4f8fb"/><style>text{font-family:Arial,sans-serif;fill:#14314a}.b{fill:#fff;stroke:#14748a;stroke-width:2}.l{stroke:#14748a;stroke-width:3;fill:none;marker-end:url(#a)}.h{font-weight:bold;font-size:19px}.t{font-size:15px}</style><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#14748a"/></marker></defs>
<rect class="b" x="20" y="125" width="160" height="85" rx="9"/><text class="h" x="36" y="156">Right bumper</text><text class="t" x="36" y="183">while held</text>
<rect class="b" x="230" y="30" width="230" height="80" rx="9"/><text class="h" x="246" y="59">Targeting in parallel</text><text class="t" x="246" y="84">flywheel, hood, drive</text>
<rect class="b" x="230" y="160" width="230" height="95" rx="9"/><text class="h" x="246" y="189">Wait for readiness</text><text class="t" x="246" y="212">flywheel + hood + alignment</text><text class="t" x="246" y="236">or 0.5 second timeout</text>
<rect class="b" x="535" y="125" width="260" height="130" rx="9"/><text class="h" x="551" y="154">Start together</text><text class="t" x="551" y="181">kicker and active floor</text><text class="t" x="551" y="204">pivot agitation and intake</text><text class="t" x="551" y="231">while command remains active</text>
<path class="l" d="M180 145 L225 85"/><path class="l" d="M180 190 H225"/><path class="l" d="M460 207 H530"/>
<text class="t" x="20" y="307">SIM: pivot uses simulated IO; kicker and active floor use empty IO in this revision.</text><text class="t" x="20" y="332">Conceptual command map, not a physical layout or proof of a match action.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc"><title id="title">Ideal gear reduction example</title><desc id="desc">A motor turns a 12-tooth driver gear, which meshes with a 36-tooth driven gear. The output rotates at one third the input speed and ideally produces three times the input torque, in the opposite direction.</desc><rect width="760" height="220" rx="18" fill="#f4f8fc"/><style>text{font:17px Arial;fill:#153348}.h{font-weight:bold;font-size:20px}</style><circle cx="180" cy="105" r="40" fill="#dceef2" stroke="#1e6b7c" stroke-width="4"/><circle cx="280" cy="105" r="60" fill="#fff" stroke="#1e6b7c" stroke-width="4"/><text x="160" y="110">12T</text><text x="260" y="110">36T</text><text x="20" y="35" class="h">Motor / driver</text><text x="220" y="198" class="h">Output / driven</text><text x="405" y="65" class="h">36 / 12 = 3:1 reduction</text><text x="405" y="98">Speed: input ÷ 3</text><text x="405" y="128">Ideal torque: input × 3</text><text x="405" y="158">External gears reverse direction</text><text x="405" y="188">Losses reduce actual torque</text></svg>
